<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .calculator {
      width: min(380px, 100%);
      background: #111827;
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    }

    .display {
      background: #0b1220;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 18px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      text-align: right;
      overflow: hidden;
    }

    .expression {
      color: #94a3b8;
      font-size: 1rem;
      min-height: 22px;
      word-break: break-all;
    }

    .result {
      color: #f8fafc;
      font-size: 2.4rem;
      font-weight: bold;
      word-break: break-all;
      line-height: 1.1;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 18px 10px;
      font-size: 1.25rem;
      font-weight: bold;
      cursor: pointer;
      background: #1f2937;
      color: #f8fafc;
      transition: 0.15s;
      user-select: none;
    }

    button:hover {
      background: #374151;
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.97);
    }

    button.operator {
      background: #334155;
      color: #93c5fd;
    }

    button.operator:hover {
      background: #475569;
    }

    button.equals {
      background: #2563eb;
      color: white;
    }

    button.equals:hover {
      background: #1d4ed8;
    }

    .zero {
      grid-column: span 2;
    }

    @media (max-width: 400px) {
      button {
        padding: 16px 8px;
        font-size: 1.1rem;
      }

      .result {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="buttons">
      <button data-action="clear" class="operator">C</button>
      <button data-action="backspace" class="operator">⌫</button>
      <button data-action="percent" class="operator">%</button>
      <button data-action="operator" data-value="/" class="operator">÷</button>

      <button data-action="digit" data-value="7">7</button>
      <button data-action="digit" data-value="8">8</button>
      <button data-action="digit" data-value="9">9</button>
      <button data-action="operator" data-value="*" class="operator">×</button>

      <button data-action="digit" data-value="4">4</button>
      <button data-action="digit" data-value="5">5</button>
      <button data-action="digit" data-value="6">6</button>
      <button data-action="operator" data-value="-" class="operator">−</button>

      <button data-action="digit" data-value="1">1</button>
      <button data-action="digit" data-value="2">2</button>
      <button data-action="digit" data-value="3">3</button>
      <button data-action="operator" data-value="+" class="operator">+</button>

      <button data-action="digit" data-value="0" class="zero">0</button>
      <button data-action="dot">.</button>
      <button data-action="equals" class="equals">=</button>
    </div>
  </div>

  <script>
    const resultEl = document.getElementById('result');
    const expressionEl = document.getElementById('expression');

    let current = '0';
    let previous = null;
    let operator = null;
    let shouldReset = false;

    function updateDisplay() {
      resultEl.textContent = current;

      if (operator && previous !== null) {
        expressionEl.textContent = `${previous} ${operatorSymbol(operator)}`;
      } else {
        expressionEl.textContent = '';
      }
    }

    function operatorSymbol(op) {
      const symbols = {
        '+': '+',
        '-': '−',
        '*': '×',
        '/': '÷'
      };
      return symbols[op] || op;
    }

    function inputDigit(digit) {
      if (shouldReset) {
        current = digit;
        shouldReset = false;
      } else {
        current = current === '0' ? digit : current + digit;
      }
      updateDisplay();
    }

    function inputDot() {
      if (shouldReset) {
        current = '0.';
        shouldReset = false;
      } else if (!current.includes('.')) {
        current += '.';
      }
      updateDisplay();
    }

    function clearAll() {
      current = '0';
      previous = null;
      operator = null;
      shouldReset = false;
      updateDisplay();
    }

    function backspace() {
      if (shouldReset) return;

      current = current.length > 1 ? current.slice(0, -1) : '0';
      updateDisplay();
    }

    function percent() {
      const value = parseFloat(current);

      if (!isNaN(value)) {
        current = formatNumber(value / 100);
        shouldReset = false;
        updateDisplay();
      }
    }

    function chooseOperator(op) {
      const inputValue = parseFloat(current);

      if (isNaN(inputValue)) return;

      if (operator && shouldReset) {
        operator = op;
        updateDisplay();
        return;
      }

      if (previous === null) {
        previous = inputValue;
      } else if (operator) {
        const result = calculate(previous, inputValue, operator);
        current = formatNumber(result);
        previous = result;
      }

      operator = op;
      shouldReset = true;
      updateDisplay();
    }

    function calculate(a, b, op) {
      switch (op) {
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        case '/': return b === 0 ? NaN : a / b;
        default: return b;
      }
    }

    function formatNumber(num) {
      if (!isFinite(num)) return 'Ошибка';
      return parseFloat(num.toFixed(10)).toString();
    }

    function equals() {
      if (operator === null || previous === null) return;

      const inputValue = parseFloat(current);
      const result = calculate(previous, inputValue, operator);

      current = formatNumber(result);
      previous = null;
      operator = null;
      shouldReset = true;

      updateDisplay();
    }

    document.querySelectorAll('button').forEach(button => {
      button.addEventListener('click', () => {
        const action = button.dataset.action;
        const value = button.dataset.value;

        if (action === 'digit') inputDigit(value);
        else if (action === 'dot') inputDot();
        else if (action === 'operator') chooseOperator(value);
        else if (action === 'equals') equals();
        else if (action === 'clear') clearAll();
        else if (action === 'backspace') backspace();
        else if (action === 'percent') percent();
      });
    });

    window.addEventListener('keydown', event => {
      const key = event.key;

      if (/[0-9]/.test(key)) {
        inputDigit(key);
      } else if (key === '.' || key === ',') {
        inputDot();
      } else if (key === '+' || key === '-' || key === '*' || key === '/') {
        chooseOperator(key);
      } else if (key === 'Enter' || key === '=') {
        event.preventDefault();
        equals();
      } else if (key === 'Escape') {
        clearAll();
      } else if (key === 'Backspace') {
        backspace();
      } else if (key === '%') {
        percent();
      }
    });

    updateDisplay();
  </script>
</body>
</html>
